function fmt(x){return (x<-0.004?"−":x>0.004?"+":"±")+Math.abs(x).toFixed(2);}
function draw(){var h="";
  if(ST.ph==="bets"){h+='<div class="k">'+L("Two bets","Zwei Wetten")+'</div><h1>'+L("After this Master’s: which trader will you be in a real market?","Nach diesem Master: Welcher Trader bist du im echten Markt?")+'</h1><p class="m">'+L("T0 knows nothing · T9 knows almost everything","T0 weiß nichts · T9 weiß fast alles")+'</p><div class="grid">';
    for(var i=0;i<10;i++)h+='<button class="'+(me.a===i?"sel":"")+'" onclick="me.a='+i+';save();send(\'a\',{k:\'a\',v:'+i+'})">T'+i+'</button>';
    h+='</div>'+stat("a")+'<h1 style="margin-top:26px">'+L("Everyone may now do what is best for them. Prices become …","Jeder darf jetzt tun, was für ihn am besten ist. Die Preise werden …")+'</h1>';
    [L("… better","… besser"),L("… about the same","… etwa gleich gut"),L("… worse","… schlechter")].forEach(function(t,i){h+='<button class="opt '+(me.b===i?"sel":"")+'" onclick="me.b='+i+';save();send(\'b\',{k:\'b\',v:'+i+'})">'+t+'</button>';});
    h+=stat("b");}
  else if(ST.ph==="market"){h+='<div class="k">'+L("Seminar market","Seminarmarkt")+' · '+L("round","Runde")+' '+ST.r+(ST.n&&ST.r<=ST.n?' / '+ST.n:'')+'</div>';
    if(me.role===null){h+='<h1>'+L("Which trader are you?","Welcher Trader bist du?")+'</h1><p class="m">'+L("Take the number on your card.","Nimm die Nummer von deiner Karte.")+'</p><div class="grid">';
      for(var j=0;j<10;j++)h+='<button onclick="me.role='+j+';save();draw()">T'+j+'</button>';h+='</div>';}
    else{var cur=me.s[ST.r]||null;
      if(ST.res&&ST.res.G){var g=ST.res.G[me.role],ls=ST.res.s.charAt(me.role);h+='<div class="card"><div class="m">'+L("Last round — you played ","Letzte Runde – du warst ")+ls+'</div><div class="big" style="color:'+(g<-0.004?"var(--red)":"#2a7f6f")+'">'+fmt(g)+'</div></div>';}
      h+='<h1>T'+me.role+' — '+L("your strategy for this round","deine Strategie für diese Runde")+'</h1>';
      [["F",L("Fundamental","Fundamental"),L("estimate the value from your coins","Wert aus deinen Münzen schätzen")],["P",L("Passive","Passiv"),L("flip a coin: buy or sell","Münze werfen: kaufen oder verkaufen")],["T",L("Follow the price","Dem Preis folgen"),L("buy if the price is above 5","kaufen, wenn der Preis über 5 liegt")]].forEach(function(o){
        h+='<button class="opt s'+o[0]+' '+(cur===o[0]?"sel":"")+'" onclick="me.s['+ST.r+']=\''+o[0]+'\';save();send(\'s\',{k:\'s\',r:'+ST.r+',role:'+me.role+',v:\''+o[0]+'\'})">'+o[0]+' · '+o[1]+'<small>'+o[2]+'</small></button>';});
      h+=(cur?stat("s"):"")+'<p class="m" style="margin-top:18px"><a href="#" onclick="me.role=null;save();draw();return false">'+L("change trader number","Trader-Nummer ändern")+'</a></p>';}}
  else if(ST.ph==="min"){var mc=me.m[ST.r]||null;h+='<div class="k">'+L("Minority game","Minority Game")+' · '+L("round","Runde")+' '+ST.r+'</div><h1>'+L("Pick A or B. Whoever is in the minority wins.","A oder B. Wer in der Minderheit ist, gewinnt.")+'</h1>';
    if(ST.res){var w=ST.res.a===ST.res.b?null:(ST.res.a<ST.res.b?"A":"B");h+='<div class="card"><div class="big">A '+ST.res.a+' · B '+ST.res.b+'</div><p>'+(w===null?L("A tie — nobody wins.","Gleichstand – niemand gewinnt."):(mc?(mc===w?'<span class="ok">'+L("You were in the minority. You win.","Du warst in der Minderheit. Gewonnen.")+'</span>':'<span class="err">'+L("You went with the herd.","Du bist mit der Herde gelaufen.")+'</span>'):L("Minority: ","Minderheit: ")+w))+'</p></div>';}
    else{h+='<div class="grid" style="grid-template-columns:1fr 1fr">';["A","B"].forEach(function(k){h+='<button style="padding:34px 6px;font-size:34px" class="'+(mc===k?"sel":"")+'" onclick="me.m['+ST.r+']=\''+k+'\';save();send(\'m\',{k:\'m\',r:'+ST.r+',v:\''+k+'\'})">'+k+'</button>';});h+='</div>'+(mc?stat("m"):"");}}
  else{h+='<div class="k">'+L("Connected","Verbunden")+'</div><h1>'+L("Eyes on the screen. Your phone wakes up when it is your turn.","Blick nach vorn. Dein Handy meldet sich, wenn du dran bist.")+'</h1>';}
  $("app").innerHTML=h;$("anon").textContent=L("anonymous · no login","anonym · ohne Anmeldung");}
function ctl(raw){try{var o=JSON.parse(raw);}catch(e){return;}if(!o||!o.ph||(o.t||0)<lastT||(o.t||0)>Date.now()+60000)return;lastT=o.t||0;
  if(o.sess&&me.sess!==o.sess){me.sess=o.sess;me.s={};me.m={};save();sent={};}
  if(o.r!==ST.r||o.ph!==ST.ph){delete sent.s;delete sent.m;}ST=o;draw();}
function feed(line){try{var m=JSON.parse(line);if(m.event==="message")ctl(m.message);}catch(e){}}
function catchUp(){return fetch(BASE+TOPIC+"c/json?poll=1&since=3h").then(function(r){return r.text();}).then(function(t){t.split("\n").forEach(function(l){if(l)feed(l);});}).catch(function(){});}
function listen(){var es=new EventSource(BASE+TOPIC+"c/sse");es.onopen=function(){$("conn").textContent="● live";catchUp();};es.onmessage=function(e){feed(e.data);};es.onerror=function(){$("conn").textContent=L("○ reconnecting …","○ verbinde neu …");};}
draw();catchUp().then(listen);
</script></body></html>
