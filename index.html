<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seminar vote</title>
<style>
:root{--paper:#f6f3ec;--ink:#1b1f24;--mute:#6b7178;--line:#d8d2c4;--F:#1f4e9c;--P:#d98a12;--T:#12806a;--red:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:22px 18px 60px}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;line-height:1.2;margin:6px 0 14px}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
p{font-size:17px;line-height:1.45;margin:8px 0}.m{color:var(--mute);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 4px}
button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px 6px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;touch-action:manipulation}
button.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;font-weight:600;font-size:17px}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:3px}.opt.sel small{color:#cfd3d8}
.sF.sel{background:var(--F);border-color:var(--F)}.sP.sel{background:var(--P);border-color:var(--P)}.sT.sel{background:var(--T);border-color:var(--T)}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.st{font-size:14.5px;min-height:22px;margin-top:6px}.ok{color:#1b6e3c;font-weight:700}.err{color:var(--red);font-weight:700}
.big{font-family:Georgia,serif;font-size:44px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 18px;font-size:12px;color:var(--mute);background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-between}
</style></head><body><main id="app"></main><div class="foot"><span id="conn">…</span><span id="anon"></span></div>
<script>
var TOPIC="sv-53b8768d64bb3fe776",BASE="https://ntfy.sh/",ST={ph:"wait",r:0,lang:"en",res:null},me={a:null,b:null,role:null,s:{}},sent={},lastT=0;
var uid;try{uid=localStorage.getItem("sv_id");if(!uid){uid=Math.random().toString(36).slice(2,10);localStorage.setItem("sv_id",uid);}var sv=JSON.parse(localStorage.getItem("sv_me")||"null");if(sv&&sv.topic===TOPIC)me=sv.me;}catch(e){uid=Math.random().toString(36).slice(2,10);}
function save(){try{localStorage.setItem("sv_me",JSON.stringify({topic:TOPIC,me:me}));}catch(e){}}
function L(en,de){return ST.lang==="de"?de:en;}
function $(i){return document.getElementById(i);}
function send(key,obj){obj.id=uid;sent[key]="…";draw();
  fetch(BASE+TOPIC+"v",{method:"POST",body:JSON.stringify(obj)}).then(function(r){sent[key]=r.ok?"ok":"err";draw();}).catch(function(){sent[key]="err";draw();});}
function stat(key){var s=sent[key];return '<div class="st">'+(s==="ok"?'<span class="ok">✓ '+L("received — you can still change it","angekommen – du kannst noch ändern")+'</span>':s==="err"?'<span class="err">'+L("not sent — tap again","nicht gesendet – nochmal tippen")+'</span>':s?"…":"")+'</div>';}
function fmt(x){return (x<-0.004?"−":x>0.004?"+":"±")+Math.abs(x).toFixed(2);}
function draw(){var h="";
  if(ST.ph==="bets"){h+='<div class="k">'+L("Two bets","Zwei Wetten")+'</div><h1>'+L("After this Master’s: which trader will you be in a real market?","Nach diesem Master: Welcher Trader bist du im echten Markt?")+'</h1><p class="m">'+L("T0 knows nothing · T9 knows almost everything","T0 weiß nichts · T9 weiß fast alles")+'</p><div class="grid">';
    for(var i=0;i<10;i++)h+='<button class="'+(me.a===i?"sel":"")+'" onclick="me.a='+i+';save();send(\'a\',{k:\'a\',v:'+i+'})">T'+i+'</button>';
    h+='</div>'+stat("a")+'<h1 style="margin-top:26px">'+L("Everyone may now do what is best for them. Prices become …","Jeder darf jetzt tun, was für ihn am besten ist. Die Preise werden …")+'</h1>';
    [L("… better","… besser"),L("… about the same","… etwa gleich gut"),L("… worse","… schlechter")].forEach(function(t,i){h+='<button class="opt '+(me.b===i?"sel":"")+'" onclick="me.b='+i+';save();send(\'b\',{k:\'b\',v:'+i+'})">'+t+'</button>';});
    h+=stat("b");}
  else if(ST.ph==="market"){h+='<div class="k">'+L("Seminar market","Seminarmarkt")+' · '+L("round","Runde")+' '+ST.r+'</div>';
    if(me.role===null){h+='<h1>'+L("Which trader are you?","Welcher Trader bist du?")+'</h1><p class="m">'+L("Take the number on your card.","Nimm die Nummer von deiner Karte.")+'</p><div class="grid">';
      for(var j=0;j<10;j++)h+='<button onclick="me.role='+j+';save();draw()">T'+j+'</button>';h+='</div>';}
    else{var cur=me.s[ST.r]||null;
      if(ST.res&&ST.res.G){var g=ST.res.G[me.role],ls=ST.res.s.charAt(me.role);h+='<div class="card"><div class="m">'+L("Last round — you played ","Letzte Runde – du warst ")+ls+'</div><div class="big" style="color:'+(g<-0.004?"var(--red)":"#1b6e3c")+'">'+fmt(g)+'</div></div>';}
      h+='<h1>T'+me.role+' — '+L("your strategy for this round","deine Strategie für diese Runde")+'</h1>';
      [["F",L("Fundamental","Fundamental"),L("estimate the value from your coins","Wert aus deinen Münzen schätzen")],["P",L("Passive","Passiv"),L("flip a coin: buy or sell","Münze werfen: kaufen oder verkaufen")],["T",L("Follow the price","Dem Preis folgen"),L("buy if the price is above 5","kaufen, wenn der Preis über 5 liegt")]].forEach(function(o){
        h+='<button class="opt s'+o[0]+' '+(cur===o[0]?"sel":"")+'" onclick="me.s['+ST.r+']=\''+o[0]+'\';save();send(\'s\',{k:\'s\',r:'+ST.r+',role:'+me.role+',v:\''+o[0]+'\'})">'+o[0]+' · '+o[1]+'<small>'+o[2]+'</small></button>';});
      h+=(cur?stat("s"):"")+'<p class="m" style="margin-top:18px"><a href="#" onclick="me.role=null;save();draw();return false">'+L("change trader number","Trader-Nummer ändern")+'</a></p>';}}
  else{h+='<div class="k">'+L("Connected","Verbunden")+'</div><h1>'+L("Eyes on the screen. Your phone wakes up when it is your turn.","Blick nach vorn. Dein Handy meldet sich, wenn du dran bist.")+'</h1>';}
  $("app").innerHTML=h;$("anon").textContent=L("anonymous · no login","anonym · ohne Anmeldung");}
function ctl(raw){try{var o=JSON.parse(raw);}catch(e){return;}if(!o||!o.ph||(o.t||0)<lastT)return;lastT=o.t||0;if(o.r!==ST.r)delete sent.s;ST=o;draw();}
function feed(line){try{var m=JSON.parse(line);if(m.event==="message")ctl(m.message);}catch(e){}}
function catchUp(){return fetch(BASE+TOPIC+"c/json?poll=1&since=3h").then(function(r){return r.text();}).then(function(t){t.split("\n").forEach(function(l){if(l)feed(l);});}).catch(function(){});}
function listen(){var es=new EventSource(BASE+TOPIC+"c/sse");es.onopen=function(){$("conn").textContent="● live";catchUp();};es.onmessage=function(e){feed(e.data);};es.onerror=function(){$("conn").textContent=L("○ reconnecting …","○ verbinde neu …");};}
draw();catchUp().then(listen);
</script></body></html>
